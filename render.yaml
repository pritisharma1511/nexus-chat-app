services:
  # Web Service running Node.js + Express + Socket.IO
  - type: web
    name: nexus-chat-app
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-chat-redis
          property: connectionString

  # Redis Managed Instance
  - type: redis
    name: nexus-chat-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
